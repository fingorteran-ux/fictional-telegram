name: Build Tibia Tactical APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar Proyecto y Compilar
        run: |
          flutter create --org com.tactical.tibia --project-name tibia_radar app
          cp main.dart app/lib/main.dart
          cp RadarService.kt app/android/app/src/main/kotlin/com/tactical/tibia/tibia_radar/RadarService.kt
          cp MainActivity.kt app/android/app/src/main/kotlin/com/tactical/tibia/tibia_radar/MainActivity.kt
          
          # Permisos Android para segundo plano, voz y notificaciones
          sed -i 's/<application/    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application/' app/android/app/src/main/AndroidManifest.xml
          
          # Inyectar servicio nativo
          sed -i 's/<\/application>/    <service android:name=".RadarService" android:foregroundServiceType="dataSync" android:exported="false" \/>\n    <\/application>/' app/android/app/src/main/AndroidManifest.xml

          cd app
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true
          flutter pub add http audioplayers shared_preferences
          flutter build apk --release

      - name: Subir APK Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Tibia-Radar-Ferobra-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
