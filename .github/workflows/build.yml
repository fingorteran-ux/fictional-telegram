name: Build Spy Ferobra APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar Proyecto y Compilar
        run: |
          flutter create --org com.tactical.tibia --project-name spy_ferobra app
          cp main.dart app/lib/main.dart
          cp RadarService.kt app/android/app/src/main/kotlin/com/tactical/tibia/spy_ferobra/RadarService.kt
          cp MainActivity.kt app/android/app/src/main/kotlin/com/tactical/tibia/spy_ferobra/MainActivity.kt
          
          # Inyectar permisos de Android y habilitar tráfico de imágenes sin restricciones
          sed -i 's/<application/    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application android:usesCleartextTraffic="true"/' app/android/app/src/main/AndroidManifest.xml
          
          # Nombre oficial "Spy Ferobra" e inyección del servicio
          sed -i 's/android:label=".*"/android:label="Spy Ferobra"/' app/android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/    <service android:name=".RadarService" android:foregroundServiceType="dataSync" android:exported="false" \/>\n    <\/application>/' app/android/app/src/main/AndroidManifest.xml

          cd app
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true
          flutter pub add http audioplayers shared_preferences
          flutter build apk --release

      - name: Subir APK Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Spy-Ferobra-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
